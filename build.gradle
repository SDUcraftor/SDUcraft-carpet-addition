plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20' apply false
    id 'net.fabricmc.fabric-loom'       version '1.17.20' apply false
    id 'com.replaymod.preprocess'       version 'c5abb4fb12'
}

preprocess {
    strictExtraMappings = false

    def mc12107 = createNode('1.21.7',           1_21_07, '')
    def mc26102 = createNode('26.1.2',           26_01_02, '')
    def mc26200 = createNode('26.2',             26_02_00, '')
    def mc26300 = createNode('26.3-snapshot-9',  26_03_00, '')

    mc12107.link(mc26102, file('versions/mapping-1.21.7-26.1.2.txt'))
    mc26102.link(mc26200, file('versions/mapping-26.1.2-26.2.txt'))
    mc26200.link(mc26300, file('versions/mapping-26.2-26.3-snapshot-9.txt'))
}

tasks.register('buildAndGather') {
    group = 'build'
    description = 'Build all version nodes and gather their jars into build/libs.'
    dependsOn(subprojects.collect { "${it.path}:build" })
    doLast {
        copy {
            from subprojects.collect { "${it.projectDir}/build/libs" }
            into "${rootProject.projectDir}/build/libs"
            include '*.jar'
            exclude '*-sources.jar', '*-dev.jar'
            duplicatesStrategy = DuplicatesStrategy.INCLUDE
        }
    }
}
